# Tests à chaque envoi : robot (sans réseau), page dans Chromium, page 404 commune, fichiers des robots lisibles.
name: tests
on:
  push:
    branches: [main, "entretien-tests/**"]
    paths-ignore: ["**.md", "data/**", "donnees/**", "assets/img/p/**"]
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Robots lisibles (YAML)
        run: |
          pip install --quiet pyyaml
          python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('YAML ok')"
      - name: Tests du robot
        run: |
          python tools/test_robot.py
      - name: Essai de la page
        run: |
          node tools/essai_page.mjs . captures
      - name: Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: captures
          retention-days: 7
